name: Build or publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      publish:
        description: Create a GitHub Release after validation
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  authenticode-policy:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Node runtime tests on Windows
        run: node --test tests/node_runtime.test.js

      - name: Run release client tests on Windows
        run: python -m unittest discover -s tests -v

      - name: Test Authenticode validation policy
        shell: pwsh
        run: ./scripts/Test-AuthenticodeValidation.ps1

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Node runtime tests
        run: node --test tests/node_runtime.test.js

      - name: Test and build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_release.py \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --output dist
          python scripts/verify_release.py dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ inputs.publish }}
    needs:
      - authenticode-policy
      - build
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download validated assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-${{ inputs.version }}
          path: dist

      - name: Reverify assets and prepare release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publishing is allowed only from refs/heads/main." >&2
            exit 1
          fi
          python scripts/verify_release.py dist
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists." >&2
            exit 1
          fi
          existing_tag="$(
            git ls-remote origin "refs/tags/$VERSION" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ -n "$existing_tag" && "$existing_tag" != "$GITHUB_SHA" ]]; then
            echo "Tag $VERSION points to $existing_tag, not $GITHUB_SHA." >&2
            exit 1
          fi
          if [[ -z "$existing_tag" ]]; then
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Sign release provenance from the protected publishing job
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Add offline provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp -- "$BUNDLE_PATH" dist/build-provenance.jsonl
          test -s dist/build-provenance.jsonl

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          cleanup_draft() {
            gh release delete "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --yes >/dev/null 2>&1 || true
          }
          trap cleanup_draft ERR
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Managed CLI Release Demo $VERSION" \
            --generate-notes \
            "${flags[@]}"
          gh release upload "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          trap - ERR
